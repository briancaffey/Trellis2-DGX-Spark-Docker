services:
  trellis2:
    build: .
    container_name: trellis2
    user: "${UID}:${GID}"
    volumes:
      - ./TRELLIS.2:/workspace/TRELLIS.2
      - ./hf_cache:/workspace/cache/huggingface
      - ./triton_cache:/workspace/cache/triton
      - ./torch_cache:/workspace/cache/torch
    ports:
      - "${GRADIO_SERVER_PORT:-7860}:${GRADIO_SERVER_PORT:-7860}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      GRADIO_SERVER_NAME: ${GRADIO_SERVER_NAME:-0.0.0.0}
      GRADIO_SERVER_PORT: ${GRADIO_SERVER_PORT:-7860}
      APP_SCRIPT: ${APP_SCRIPT:-app.py}
      CUDA_HOME: /usr/local/cuda-12.9
      HF_TOKEN: ${HF_TOKEN}
      ATTN_BACKEND: ${ATTN_BACKEND:-flash-attn}

      HF_HOME: /workspace/cache/huggingface
      TRITON_CACHE_DIR: /workspace/cache/triton
      TORCH_HOME: /workspace/cache/torch
    env_file:
      - .env
    working_dir: /workspace/TRELLIS.2
    tty: true
    stdin_open: true

  # FastAPI service: POST an image, get back GLB/OBJ/PLY/STL (+ optional preview).
  # Start with:  docker compose up --build api
  trellis2-api:
    build: .
    container_name: trellis2-api
    # Self-heal: if a request ever crashes the worker (e.g. a CUDA OOM on a large
    # job), the node comes back automatically instead of going dark.
    restart: unless-stopped
    user: "${UID}:${GID}"
    volumes:
      - ./TRELLIS.2:/workspace/TRELLIS.2
      # Mount the FastAPI package alongside trellis2 so `api.server` is importable.
      - ./api:/workspace/TRELLIS.2/api
      - ./hf_cache:/workspace/cache/huggingface
      - ./triton_cache:/workspace/cache/triton
      - ./torch_cache:/workspace/cache/torch
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      APP_SCRIPT: api
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      CUDA_HOME: /usr/local/cuda-12.9
      HF_TOKEN: ${HF_TOKEN}
      ATTN_BACKEND: ${ATTN_BACKEND:-flash-attn}
      # Model selection (override per-request via the `quantization` field too):
      #   bf16 | gguf:Q8_0 | gguf:Q4_K_M
      TRELLIS2_DEFAULT_VARIANT: ${TRELLIS2_DEFAULT_VARIANT:-bf16}
      HF_HOME: /workspace/cache/huggingface
      TRITON_CACHE_DIR: /workspace/cache/triton
      TORCH_HOME: /workspace/cache/torch
    env_file:
      - .env
    working_dir: /workspace/TRELLIS.2
    tty: true
    stdin_open: true
